databases:
  - name: agentproof-db
    databaseName: agentproof
    user: agentproof
    plan: basic-256mb

services:
  - type: web
    name: agentproof-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /ready
    preDeployCommand: bun --cwd=apps/api run db:migrate
    envVars:
      - key: API_PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: agentproof-db
          property: connectionString
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_NEGATIVE_TESTING
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: AG_STUDIO_LICENSE_KEY
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: WEB_ORIGIN
        value: http://localhost:5173
  - type: web
    name: agentproof-web
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    envVars:
      - key: PORT
        value: 10000
