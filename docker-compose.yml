services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agentproof
      POSTGRES_USER: agentproof
      POSTGRES_PASSWORD: agentproof
    ports:
      - "5433:5432"
    volumes:
      - agentproof-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentproof -d agentproof"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agentproof-postgres:
